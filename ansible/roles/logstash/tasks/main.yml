---
- name: Install Logstash
  ansible.builtin.include_role:
    name: common
    tasks_from: install_elastic_package
  vars:
    common_elastic_package: logstash

- name: Create the certs directory
  ansible.builtin.file:
    path: "{{ logstash_conf_dir }}/certs"
    state: directory
    owner: root
    group: logstash
    mode: "0750"

- name: Install node TLS material
  ansible.builtin.copy:
    src: "{{ elk_certs_local_dir }}/{{ item.src }}"
    dest: "{{ logstash_conf_dir }}/certs/{{ item.dest }}"
    owner: root
    group: logstash
    mode: "{{ item.mode }}"
  loop:
    - { src: "ca/ca.crt", dest: "ca.crt", mode: "0644" }
    - { src: "{{ inventory_hostname }}/{{ inventory_hostname }}.crt", dest: "node.crt", mode: "0644" }
    - { src: "{{ inventory_hostname }}/{{ inventory_hostname }}.key", dest: "node.key", mode: "0640" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart logstash

# The systemd unit reads this file, so the keystore password never appears in
# a config file Logstash itself loads.
- name: Provide the keystore password to the service
  ansible.builtin.copy:
    dest: /etc/default/logstash
    content: |
      LOGSTASH_KEYSTORE_PASS={{ vault_logstash_keystore_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart logstash

- name: Create the password-protected keystore
  ansible.builtin.command:
    cmd: /usr/share/logstash/bin/logstash-keystore --path.settings {{ logstash_conf_dir }} create
    creates: "{{ logstash_conf_dir }}/logstash.keystore"
  environment:
    LOGSTASH_KEYSTORE_PASS: "{{ vault_logstash_keystore_password }}"
  no_log: true

- name: Read the keystore entries
  ansible.builtin.command: /usr/share/logstash/bin/logstash-keystore --path.settings {{ logstash_conf_dir }} list
  environment:
    LOGSTASH_KEYSTORE_PASS: "{{ vault_logstash_keystore_password }}"
  register: logstash_keystore
  changed_when: false
  no_log: true

- name: Store the Elasticsearch output password
  ansible.builtin.command:
    cmd: /usr/share/logstash/bin/logstash-keystore --path.settings {{ logstash_conf_dir }} add ES_WRITER_PASSWORD
    stdin: "{{ logstash_writer_password }}"
  environment:
    LOGSTASH_KEYSTORE_PASS: "{{ vault_logstash_keystore_password }}"
  when: "'es_writer_password' not in (logstash_keystore.stdout | lower)"
  changed_when: true
  no_log: true
  notify: Restart logstash

- name: Let the logstash user read the keystore
  ansible.builtin.file:
    path: "{{ logstash_conf_dir }}/logstash.keystore"
    owner: root
    group: logstash
    mode: "0640"

- name: Write logstash.yml
  ansible.builtin.template:
    src: logstash.yml.j2
    dest: "{{ logstash_conf_dir }}/logstash.yml"
    owner: root
    group: logstash
    mode: "0640"
  notify: Restart logstash

- name: Set the JVM heap size
  ansible.builtin.copy:
    dest: "{{ logstash_conf_dir }}/jvm.options.d/heap.options"
    content: |
      -Xms{{ logstash_heap_size }}
      -Xmx{{ logstash_heap_size }}
    owner: root
    group: logstash
    mode: "0644"
  notify: Restart logstash

- name: Write the Beats pipeline
  ansible.builtin.template:
    src: beats.conf.j2
    dest: "{{ logstash_conf_dir }}/conf.d/beats.conf"
    owner: root
    group: logstash
    mode: "0640"
  notify: Restart logstash

- name: Enable Logstash
  ansible.builtin.systemd_service:
    name: logstash
    enabled: true
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Start Logstash
  ansible.builtin.systemd_service:
    name: logstash
    state: started

- name: Wait for the Logstash API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ logstash_api_port }}/?pretty"
    status_code: 200
  register: logstash_api
  until: logstash_api.status == 200
  retries: 30
  delay: 10

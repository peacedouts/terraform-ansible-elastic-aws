---
- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - chrony
      - curl
      - gnupg
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep time in sync (TLS and cluster coordination depend on it)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the Elastic signing key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/keyrings/elastic.asc
    mode: "0644"

- name: Add the Elastic apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/elastic.asc]
      https://artifacts.elastic.co/packages/{{ elastic_major_version }}.x/apt stable main
    filename: elastic-{{ elastic_major_version }}.x
    state: present
    update_cache: true

# Every client names the stack CA explicitly, so it stays out of the system
# trust store. Trusting it there would let a leaked CA key impersonate apt, S3
# or SSM endpoints. This removes it if an earlier version installed it.
- name: Keep the stack CA out of the system trust store
  ansible.builtin.file:
    path: /usr/local/share/ca-certificates/elk-stack-ca.crt
    state: absent
  notify: Update CA trust

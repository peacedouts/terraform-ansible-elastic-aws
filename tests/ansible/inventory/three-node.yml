---
# Mirrors what the aws_ec2 inventory produces for the default 3-node layout.
all:
  children:
    elk:
      children:
        elasticsearch:
          hosts:
            elk-test-es-01: { private_ip: 10.40.128.11, private_dns: ip-10-40-128-11.ec2.internal, placement: { availability_zone: us-east-1a } }
            elk-test-es-02: { private_ip: 10.40.144.12, private_dns: ip-10-40-144-12.ec2.internal, placement: { availability_zone: us-east-1b } }
            elk-test-es-03: { private_ip: 10.40.160.13, private_dns: ip-10-40-160-13.ec2.internal, placement: { availability_zone: us-east-1c } }
        kibana:
          hosts:
            elk-test-kibana-01: { private_ip: 10.40.128.21, private_dns: ip-10-40-128-21.ec2.internal, placement: { availability_zone: us-east-1a } }
        logstash:
          hosts:
            elk-test-logstash-01: { private_ip: 10.40.144.31, private_dns: ip-10-40-144-31.ec2.internal, placement: { availability_zone: us-east-1b } }

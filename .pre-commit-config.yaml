---
# pip install pre-commit && pre-commit install
# Run `pre-commit autoupdate` to move hooks to their latest releases.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Refuses to commit an unencrypted vault file.
  - repo: local
    hooks:
      - id: vault-encrypted
        name: Ansible vault files are encrypted
        language: system
        files: (^|/)vault\.ya?ml$
        entry: bash -c 'for f in "$@"; do head -1 "$f" | grep -q "^\$ANSIBLE_VAULT" || { echo "$f is not encrypted"; exit 1; }; done' --

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
